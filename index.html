<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero Hero - كورس الاحتراف</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --accent-color: #bb86fc;
            --secondary-text: #a0a0a0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        h1 { color: var(--accent-color); margin-bottom: 10px; }
        p { color: var(--secondary-text); font-size: 1.1rem; }

        .ad-container {
            background: #252525;
            padding: 20px;
            margin: 20px 0;
            border: 1px dashed var(--accent-color);
            border-radius: 10px;
            min-height: 100px;
        }

        .btn {
            background-color: var(--accent-color);
            color: #000;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
        }

        .btn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        #timer {
            font-weight: bold;
            color: #ffb74d;
        }

        #channel-link { display: none; margin-top: 20px; }

        .instruction {
            font-size: 0.9rem;
            color: #ff5252;
            margin-top: 10px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Zero Hero</h1>
        <p>أهلاً بك في كورس الاحتراف. للدخول إلى القناة، يرجى دعمنا بمشاهدة الإعلان أدناه.</p>

        <!-- مكان كود إعلان Adsterra -->
        <div class="ad-container" id="ad-box">
            <p style="font-size: 0.8rem;">[ إعلان Adsterra يظهر هنا ]</p>
            <!-- الصق كود Adsterra Direct Link أو Banner هنا -->
            <script type="text/javascript">
                // ملاحظة: ضع كود الإعلان الخاص بك هنا
            </script>
        </div>

        <div id="status-area">
            <p>انتظر <span id="timer">30</span> ثانية لتفعيل الرابط...</p>
            <p class="instruction">يجب الضغط على الإعلان لضمان تفعيل الزر</p>
        </div>

        <div id="channel-link">
            <a href="https://t.me/zeroheroiq" class="btn">دخول قناة التليجرام الآن</a>
        </div>
    </div>

    <script>
        let timeLeft = 30;
        let timerElement = document.getElementById('timer');
        let adBox = document.getElementById('ad-box');
        let statusArea = document.getElementById('status-area');
        let channelLink = document.getElementById('channel-link');
        let clicked = false;

        // تتبع الضغط على منطقة الإعلان
        adBox.addEventListener('click', () => {
            clicked = true;
        });

        const countdown = setInterval(() => {
            timeLeft--;
            timerElement.innerText = timeLeft;

            if (timeLeft <= 0) {
                clearInterval(countdown);
                if(clicked) {
                    showLink();
                } else {
                    timerElement.innerText = "0";
                    alert("يرجى الضغط على الإعلان أولاً لتفعيل الرابط!");
                    // إعادة المحاولة إذا لم يضغط
                    timeLeft = 5; 
                }
            }
        }, 1000);

        function showLink() {
            statusArea.style.display = 'none';
            channelLink.style.display = 'block';
        }
    </script>

</body>
</html>
